<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>约电</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background: #eef2f7;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .app {
            max-width: 430px;
            min-height: 100vh;
            margin: 0 auto;
            background: #F6F8FA;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, .08);
        }

        .page {
            padding-bottom: 80px
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 12px 4px;
        }

        .location {
            font-size: 15px;
            font-weight: 700;
            color: #111827
        }

        .notice {
            font-size: 15px
        }

        .card {
            background: #fff;
            border-radius: 20px;
            margin: 14px;
            padding: 16px;
        }

        .ride-search {
            background: linear-gradient(100deg, #4f7fc4, #6fa4e6);
            color: #fff;
        }

        .ride-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .search-box {
            background: #fff;
            color: #94a3b8;
            border-radius: 14px;
            padding: 14px;
        }

        .car-scroll {
            display: flex;
            gap: 10px;
            overflow: auto;
            padding: 0 14px;
        }

        .car-scroll::-webkit-scrollbar {
            display: none
        }

        .car-item {
            white-space: nowrap;
            background: #ffffff;
            border-radius: 999px;
            padding: 10px 16px;
            font-size: 14px;
            color: #475569;
        }

        .car-item.active {
            background: #cedafc;
            color: #000000;
        }

        .rescue-card {
            background: linear-gradient(120deg, #f37442, #f7e47c);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rescue-title {
            font-size: 22px;
            font-weight: 700
        }

        .rescue-desc {
            margin-top: 6px;
            font-size: 14px
        }

        .call-btn {
            background: #fff;
            color: #FF7A00;
            padding: 10px 18px;
            border-radius: 999px;
            font-weight: 700;
        }

        .section-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 14px;
            color: #111827;
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .service-item {
            text-align: center
        }

        .service-icon {
            font-size: 28px
        }

        .service-item span {
            display: block;
            margin-top: 8px;
            font-size: 13px;
            color: #475569;
        }

        .vehicle-name {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .tags span {
            display: inline-block;
            background: #EAF3FF;
            color: #1677FF;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            margin-right: 6px;
        }

        .arrive {
            margin-top: 6px;
            color: #7c7b7b;
            font-size: 12px;
            font-weight: 700;
        }

        .banner {
            background: linear-gradient(135deg, #374b7a, #536c8f);
            color: #fff;
            border-radius: 18px;
            padding: 20px;
        }

        .banner h3 {
            margin-bottom: 8px
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            height: 64px;
            background: #fff;
            border-top: 1px solid #f0f0f0;
            display: flex;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 11px;
        }

        .nav-item.active {
            color: #1677FF;
            font-weight: 600;
        }

        .nav-icon {
            font-size: 22px;
            margin-bottom: 2px;
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="page">

            <div class="header">
                <div class="location">📍 深圳 ▼</div>
                <div class="notice">🔔</div>
            </div>

            <div class="card ride-search">
                <div class="ride-title">🚘 我要去哪</div>
                <div class="search-box">请输入目的地</div>
            </div>

            <div class="car-scroll">
                <div class="car-item active">快车</div>
                <div class="car-item">专车</div>
                <div class="car-item">商务车</div>
                <div class="car-item">接送机</div>
            </div>

            <div class="card rescue-card">
                <div>
                    <div class="rescue-title">🛟 一键救援</div>
                    <div class="rescue-desc">移动补电 · 拖车救援 · 换胎服务</div>
                </div>
                <div class="call-btn">呼叫</div>
            </div>

            <div class="card">
                <div class="section-title">常用服务</div>
                <div class="service-grid">
                    <div class="service-item">
                        <div class="service-icon">🚖</div><span>预约出行</span>
                    </div>
                    <div class="service-item">
                        <div class="service-icon">✈️</div><span>接机送机</span>
                    </div>
                    <div class="service-item">
                        <div class="service-icon">🏢</div><span>企业用车</span>
                    </div>
                    <div class="service-item">
                        <div class="service-icon">🔋</div><span>移动补电</span>
                    </div>
                    <div class="service-item">
                        <div class="service-icon">🚛</div><span>拖车救援</span>
                    </div>
                    <div class="service-item">
                        <div class="service-icon">👑</div><span>会员中心</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="section-title">最近可服务车辆</div>
                <div class="vehicle-name">🚘 A01能源服务车</div>
                <div class="tags">
                    <span>可接送</span>
                    <span>可补电</span>
                    <span>可救援</span>
                </div>
                <div class="arrive">预计3分钟到达</div>
            </div>

            <div class="card">
                <div class="section-title">新人专享</div>
                <div class="banner">
                    <h3>打车券 + 救援体验券</h3>
                    <div>注册即领，首单立减</div>
                </div>
            </div>

        </div>

        <div class="bottom-nav">
            <div class="nav-item active">
                <div class="nav-icon">🏠</div>首页
            </div>
            <div class="nav-item">
                <div class="nav-icon">🚘</div>出行
            </div>
            <div class="nav-item">
                <div class="nav-icon">🛟</div>救援
            </div>
            <div class="nav-item">
                <div class="nav-icon">👤</div>我的
            </div>
        </div>

    </div>
</body>

</html>
